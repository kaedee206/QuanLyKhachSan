services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sunhotel_sqlserver
    user: "0:0"
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P \"${SA_PASSWORD}\" -Q \"SELECT 1\" -b -C"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sunhotel_app
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SunHotelDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=false"
      SePay__MerchantId: "${SEPAY_MERCHANT_ID}"
      SePay__SecretKey: "${SEPAY_SECRET_KEY}"
      SePay__SuccessUrl: "${APP_BASE_URL}/Payment/SePaySuccess"
      SePay__ErrorUrl: "${APP_BASE_URL}/Payment/SePayError"
      SePay__CancelUrl: "${APP_BASE_URL}/Payment/SePayCancel"
      SePay__IpnUrl: "${APP_BASE_URL}/webhook/sepay"
      AppSettings__JwtSecret: "${JWT_SECRET}"
      Email__User: "${EMAIL_USER}"
      Email__Password: "${EMAIL_PASSWORD}"
      Email__From: "${EMAIL_FROM}"
    volumes:
      - app_logs:/app/logs
      - app_keys:/app/keys
    restart: unless-stopped

volumes:
  sqlserver_data:
  app_logs:
  app_keys:
