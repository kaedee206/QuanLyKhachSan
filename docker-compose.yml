services:
  postgres:
    image: postgres:16-alpine
    container_name: sunhotel_postgres
    environment:
      POSTGRES_USER: "${DB_USER:-sunhotel}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-YourStrongPassword123!}"
      POSTGRES_DB: "${DB_NAME:-SunHotelDB}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sunhotel} -d ${DB_NAME:-SunHotelDB}"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sunhotel_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "5000"
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME:-SunHotelDB};Username=${DB_USER:-sunhotel};Password=${DB_PASSWORD:-YourStrongPassword123!};"
      SePay__MerchantId: "${SEPAY_MERCHANT_ID}"
      SePay__SecretKey: "${SEPAY_SECRET_KEY}"
      SePay__SuccessUrl: "${APP_BASE_URL}/Payment/SePaySuccess"
      SePay__ErrorUrl: "${APP_BASE_URL}/Payment/SePayError"
      SePay__CancelUrl: "${APP_BASE_URL}/Payment/SePayCancel"
      SePay__IpnUrl: "${APP_BASE_URL}/webhook/sepay"
      VietQR__BankId: "${VIETQR_BANK_ID}"
      VietQR__AccountNo: "${VIETQR_ACCOUNT_NO}"
      VietQR__AccountName: "${VIETQR_ACCOUNT_NAME}"
      AppSettings__JwtSecret: "${JWT_SECRET}"
      Email__User: "${EMAIL_USER}"
      Email__Password: "${EMAIL_PASSWORD}"
      Email__From: "${EMAIL_FROM}"
    volumes:
      - app_logs:/app/logs
      - app_keys:/app/keys
    restart: unless-stopped

volumes:
  postgres_data:
  app_logs:
  app_keys:
